name: macos-test

on: [push]

jobs: 
  test:
    runs-on: macos-latest
    steps:
      -uses: actions/checkout@v4

      -uses: actions/setup-python@v5
      with:
        python-version: "3.14.2"

      -name: Install dependencies
      run: pip install -r requirements.txt

      -name: Run project
      run: python main.py